site_name: PowerPoint MCP Server
site_url: https://powerpointmcpserver.dev/
site_description: >-
  Control Microsoft PowerPoint with natural language through AI assistants like
  GitHub Copilot and Claude. Automate slides, shapes, tables, charts, and export-to-verify
  visual checks on a live PowerPoint desktop instance.
site_author: Stefan Broenner
copyright: Copyright &copy; 2025&ndash;2026 Stefan Broenner &mdash; MIT License

repo_url: https://github.com/sbroenne/mcp-server-powerpoint
repo_name: sbroenne/mcp-server-powerpoint
edit_uri: edit/main/gh-pages/docs/

docs_dir: docs
site_dir: _site
use_directory_urls: true

# Raw generated includes live in docs/_generated/ and are pulled into the thin
# wrapper pages via pymdownx.snippets. They must NOT be built as standalone
# pages (snippets reads them straight from disk, independent of this exclusion).
exclude_docs: |
  _generated/

# Pulled-in source READMEs may contain repo-relative links (e.g. ../../README.md)
# that intentionally point at GitHub, not the site. Keep these as warnings, never
# fatal, so the build stays green.
validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: ignore
  not_found: warn
  nav:
    omitted_files: ignore

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/images/icon.png
  favicon: favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Features: features.md
  - Installation:
      - Overview: installation.md
      - Claude Desktop: claude-desktop.md
      - VS Code & GitHub Copilot: vs-code.md
      - Cursor: cursor.md
  - Guides:
      - Overview: guides/index.md
      - Build a deck with AI: guides/build-a-deck-with-ai.md
      - Edit an existing deck: guides/edit-an-existing-deck.md
      - Export slides to images: guides/export-slides-to-images.md
      - Automate charts & tables: guides/automate-charts-and-tables.md
      - Apply a corporate template: guides/apply-a-corporate-template.md
  - Reference:
      - Overview: reference/index.md
      - Session workflow: reference/workflows.md
      - Behavioral rules: reference/behavioral-rules.md
      - Anti-patterns: reference/anti-patterns.md
      - Building a deck: reference/deck-builder.md
      - Slides & shapes: reference/slides-and-shapes.md
      - Text formatting: reference/text-formatting.md
      - Tables: reference/tables.md
      - Charts: reference/charts.md
      - Images: reference/images.md
      - SmartArt: reference/smartart.md
      - Speaker notes: reference/speaker-notes.md
      - Layouts: reference/layouts.md
      - Slide master: reference/slide-master.md
      - Export & verification: reference/export-and-verify.md
  - MCP Server: mcp-server.md
  - CLI: cli.md
  - Help:
      - FAQ: faq.md
      - Troubleshooting: troubleshooting.md
      - Comparison: comparison.md
  - More:
      - Agent Skills: skills.md
      - Architecture: architecture.md
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Security: security.md
      - Privacy: privacy.md
      - Related projects: related-projects.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - docs
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  # /llms.txt, /llms-full.txt and the per-page Markdown mirrors are generated in
  # hooks.py from the resolved navigation, so they cannot go stale the way a
  # hand-curated plugin section map does. See on_post_build there.
  - minify:
      minify_html: true

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sbroenne/mcp-server-powerpoint
      name: GitHub repository
  generator: false

hooks:
  - hooks.py
