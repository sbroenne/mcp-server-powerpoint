# GitHub Dependabot configuration for PowerPointMcp
# Automatically keeps dependencies up-to-date and secure

version: 2
updates:
  # NuGet dependencies - check weekly
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "sbroenne"
    groups:
      production-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Ignore specific packages if needed
      # - dependency-name: "PackageName"
      #   versions: ["1.x", "2.x"]

  # GitHub Actions - check weekly
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    reviewers:
      - "sbroenne"
    groups:
      github-actions:
        patterns:
          - "*"

  # Documentation site (MkDocs)
  - package-ecosystem: "pip"
    directory: "/gh-pages"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "documentation"
    commit-message:
      prefix: "chore(docs-deps)"
    reviewers:
      - "sbroenne"
    groups:
      docs-dependencies:
        patterns:
          - "*"

  # Changesets tooling at the repository root
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "sbroenne"
    groups:
      changesets:
        patterns:
          - "*"

  # VS Code extension
  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(vscode-deps)"
      include: "scope"
    reviewers:
      - "sbroenne"
    groups:
      vscode-extension:
        patterns:
          - "*"
