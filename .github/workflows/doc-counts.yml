# Generate canonical MCP tool/action counts after changes reach the main branch.
# Pull requests validate count structure; this workflow updates advertised numbers once merged.
name: Update Documentation Counts

on:
  push:
    branches: [main]

concurrency:
  group: doc-counts-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-doc-counts:
    name: Generate documentation counts
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sbroenne.PowerPointMcp.slnx

      - name: Generate documentation counts
        shell: pwsh
        run: |
          & ./scripts/check-doc-counts.ps1 -Update
          if ($LASTEXITCODE -ne 0) {
            throw "Could not generate documentation counts."
          }
          & ./scripts/Build-AgentSkills.ps1 -PopulateReferences -SkipCliReference
          if ($LASTEXITCODE -ne 0) {
            throw "Could not synchronize generated Agent Skills references."
          }

      - name: Commit and push updated counts
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Documentation counts already current; nothing to commit."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            throw "Could not check for generated documentation changes."
          }

          $committed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (-not $committed) {
              git commit -m "chore: update documentation counts"
              if ($LASTEXITCODE -ne 0) {
                throw "Could not commit generated documentation counts."
              }
              $committed = $true
            }
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            Write-Host "Push rejected (main advanced); rebasing and retrying (attempt $attempt)..."
            git fetch origin main
            git rebase origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Could not rebase generated documentation counts onto main."
            }
          }

          throw "Could not push generated documentation counts to main after 3 attempts."
